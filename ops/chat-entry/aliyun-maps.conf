# HTTP context. Only the fixed Tencent origin may bypass legacy entry redirects.
map $uri $omindos_chat_public_path {
    default /chat$request_uri;
    ~^/learning(?:/|$) $request_uri;
}
map "$realip_remote_addr:$http_x_omindos_chat_entry" $omindos_chat_via_main {
    default 0;
    "43.138.161.143:1" 1;
}
map "$omindos_chat_via_main:$request_method:$uri" $omindos_chat_legacy_page {
    default 0;
    ~^0:(GET|HEAD):/$ 1;
    ~^0:(GET|HEAD):/(learning|manage|technology|research|originmind|ius|newbie-village)/?$ 1;
    ~^0:(GET|HEAD):/learning/(admin|index.html)/?$ 1;
    ~^0:(GET|HEAD):/arena/?$ 1;
    ~^0:(GET|HEAD):/arena/(admin|team.html|gold-rush-instant)/?$ 1;
    ~^0:(GET|HEAD):/platform-orientation.html$ 1;
}
