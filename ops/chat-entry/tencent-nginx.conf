# Include inside the existing omindos.cn HTTPS server only.
location = /chat { return 308 /chat/$is_args$args; }
location ^~ /chat/ {
    client_max_body_size 10m;
    proxy_pass http://127.0.0.1:18887;
    proxy_http_version 1.1;
    proxy_set_header Host omindos.cn;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 1200s;
    proxy_send_timeout 1200s;
}
location = /learning {
    proxy_pass http://127.0.0.1:18887;
    proxy_set_header Host omindos.cn;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
}
location ^~ /learning/ {
    client_max_body_size 10m;
