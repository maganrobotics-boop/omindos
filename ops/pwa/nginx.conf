# Include inside the existing Chinese HTTPS server block. Root stays bound to
# the current atomic release symlink. No application proxy or API is changed.
location = /pwa/sw.js {
    try_files $uri =404;
    default_type application/javascript;
    add_header Service-Worker-Allowed "/" always;
    add_header Cache-Control "no-cache, must-revalidate" always;
    include /etc/nginx/snippets/omindos-static-headers.conf;
}
location ^~ /pwa/ {
    try_files $uri =404;
    types {
        application/manifest+json webmanifest;
        application/javascript js;
        text/css css;
        text/html html;
        image/png png;
    }
    add_header Cache-Control "no-cache, must-revalidate" always;
    include /etc/nginx/snippets/omindos-static-headers.conf;
}
