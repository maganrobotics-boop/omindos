# omindos.com brand entry, 2026-10-11. Preserve the existing DNS, TLS and verification paths.
server {
    listen 80;
    listen [::]:80;
    server_name omindos.com www.omindos.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/omindos-com-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location = /WW_verify_TrIXNK3EoirCVbIT.txt {
        alias /var/www/originmind-verification/chat/WW_verify_TrIXNK3EoirCVbIT.txt;
        types {}
        default_type text/plain;
    }
    location / { return 302 https://omindos.cn$request_uri; }
}

# Existing validated certificate covers both apex and www.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name omindos.com www.omindos.com;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/nginx/ssl/originmind/20261007/omindos.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/originmind/20261007/omindos.com/privkey.pem;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/omindos-com-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location = /WW_verify_TrIXNK3EoirCVbIT.txt {
        alias /var/www/originmind-verification/chat/WW_verify_TrIXNK3EoirCVbIT.txt;
        types {}
        default_type text/plain;
    }
    location / { return 302 https://omindos.cn$request_uri; }
}
