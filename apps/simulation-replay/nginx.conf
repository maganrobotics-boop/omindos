# Candidate snippet; include only after production publication is authorized.
# Add inside the existing cloud.omindos.cn HTTPS server.
location = /quadruped {
    return 308 /quadruped/;
}
location = /quadruped/ {
    rewrite ^ /quadruped/index.html last;
}
location = /quadruped/index.html {
    alias /var/www/omindos-quadruped-replay/current/index.html;
    include /etc/nginx/snippets/omindos-quadruped-replay-headers.conf;
}
location ^~ /quadruped/ {
    return 404;
}
