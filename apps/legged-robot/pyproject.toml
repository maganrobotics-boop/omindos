[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "omindos-legged-robot"
version = "0.1.0a1"
description = "OmindOS legged robot interfaces and Roboto Origin simulation adapter"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
dependencies = []

[project.optional-dependencies]
sim = ["mujoco>=3.2,<4", "onnxruntime>=1.17,<2", "numpy>=1.24,<3", "PyYAML>=6,<7", "scipy>=1.10,<2"]
video = ["opencv-python-headless>=4.8,<6"]
test = ["pytest>=8,<10"]

[project.scripts]
legged-robot = "omindos_legged.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omindos_legged"]

[tool.hatch.build.targets.wheel.force-include]
"configs/roboto_origin" = "omindos_legged/data/roboto_origin"

[tool.hatch.build.targets.sdist]
include = ["/src", "/configs", "/docs", "/tests", "/scripts", "/README.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md", "/requirements-sim.txt", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
