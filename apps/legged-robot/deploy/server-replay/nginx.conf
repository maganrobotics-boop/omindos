# Include inside the existing cloud.omindos.cn HTTPS server.
location = /legged-robot {
    return 308 /legged-robot/;
}
location ^~ /legged-robot/ {
    alias /var/www/omindos-legged-replay/current/;
    index index.html;
    autoindex off;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; frame-ancestors 'self'; base-uri 'self'" always;
}
