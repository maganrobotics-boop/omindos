<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex, follow">
  <title>Page not found | OriginMind</title>
  <link rel="icon" href="/favicon.png">
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Hiragino Sans", "Yu Gothic", Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 28px; color: #101828; background: radial-gradient(circle at 50% 0, #eff4ff 0, #f6f8fb 56%, #fff 100%); }
    main { width: min(720px, 100%); padding: clamp(32px, 6vw, 60px); border: 1px solid #d0d5dd; border-top: 3px solid #155eef; border-radius: 12px; background: #fff; box-shadow: 0 18px 50px rgba(16, 24, 40, .08); }
    .code { margin: 0 0 12px; color: #155eef; font: 700 clamp(48px, 10vw, 82px)/1 "Segoe UI", sans-serif; letter-spacing: -.04em; }
    h1 { margin: 0 0 16px; font-size: clamp(28px, 5vw, 42px); line-height: 1.16; letter-spacing: -.02em; }
    p { margin: 0; color: #475467; font-size: 17px; line-height: 1.7; }
    nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    a { min-height: 48px; display: inline-flex; align-items: center; padding: 0 18px; border: 1px solid #155eef; border-radius: 9px; color: #fff; background: #155eef; font-size: 14px; font-weight: 700; text-decoration: none; }
    a.secondary { color: #344054; background: #fff; border-color: #d0d5dd; }
    a:focus-visible { outline: 3px solid rgba(21, 94, 239, .32); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Page not found</h1>
    <p>The page may have moved, no longer exists, or the address may be incorrect.</p>
    <nav aria-label="Helpful links">
      <a href="https://omindos.ai/en/">Return home</a>
      <a class="secondary" href="https://omindos.ai/founding-oem">OEM Program</a>
    </nav>
  </main>
</body>
</html>
