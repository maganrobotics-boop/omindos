name: Complete the authorized PWA release once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/pwa-release-once-20261021.yml']
  pull_request:
    paths: ['.github/workflows/pwa-release-once-20261021.yml']

permissions:
  contents: read

concurrency:
  group: pwa-release-once-20261021
  cancel-in-progress: false

jobs:
  verify-request:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require the exact tested source plus this single release request
        run: |
          python3 - <<'PY'
          import subprocess
          base = 'c601e598959de7779436d95739905e51e394155f'
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          count = subprocess.check_output(['git', 'rev-list', '--count', base + '..HEAD'], text=True).strip()
          assert count == '1', 'This request is valid only on its first reviewed commit'
          changed = subprocess.check_output(['git', 'diff', '--name-status', base, 'HEAD'], text=True).splitlines()
          assert changed == ['A\t.github/workflows/pwa-release-once-20261021.yml'], changed
          print('Application tree matches the tested PWA cache fix; only this one-time request was added')
          PY

  dispatch:
    needs: verify-request
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch the existing guarded production workflow exactly once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const repo = process.env.GITHUB_REPOSITORY;
          const head = process.env.GITHUB_SHA;
          assert.equal(repo, 'maganrobotics-boop/omindos');
          assert.equal(process.env.GITHUB_REF, 'refs/heads/main');
          const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
          const root = `https://api.github.com/repos/${repo}`;
          const ref = await fetch(root + '/git/ref/heads/main', { headers });
          assert.equal(ref.status, 200);
          assert.equal((await ref.json()).object.sha, head, 'Main moved; do not dispatch another source');
          const listed = await fetch(root + '/actions/runs?event=workflow_dispatch&per_page=50', { headers });
          assert.equal(listed.status, 200);
          const runs = (await listed.json()).workflow_runs.filter(run => run.path === '.github/workflows/deploy-website.yml');
          if (runs.some(run => run.head_sha === head)) {
            console.log('This exact source already has a manual release request; no duplicate dispatch');
          } else {
            assert.ok(!runs.some(run => run.status !== 'completed'), 'Another manual release is active');
            const response = await fetch(root + '/actions/workflows/deploy-website.yml/dispatches', {
              method: 'POST', headers: { ...headers, 'Content-Type': 'application/json' },
              body: JSON.stringify({ ref: 'main', inputs: { target: 'production', statistics_mode: 'preserve-current', release_source: 'current-main' } }),
            });
            assert.equal(response.status, 204, 'Guarded production dispatch failed');
            console.log('Requested the authorized PWA production release at ' + head);
          }
          JS
