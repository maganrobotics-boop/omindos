name: Check OA and release production manually

on:
  push:
    branches: [main]
    paths:
      - 'apps/oa/**'
      - 'migrations/oa/**'
      - '.github/workflows/deploy-oa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/oa/**'
      - 'migrations/oa/**'
      - '.github/workflows/deploy-oa.yml'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type the exact Worker:D1:domain production confirmation'
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/oa/package-lock.json
      - name: Install locked OA dependencies
        working-directory: apps/oa
        run: npm run install:ci
      - name: Check OA types
        working-directory: apps/oa
        run: npm run typecheck
      - name: Lint OA
        working-directory: apps/oa
        run: npm run lint
      - name: Build and test OA
        working-directory: apps/oa
        run: npm test

  reject-invalid-production-dispatch:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.ref != 'refs/heads/main' ||
      inputs.confirmation != 'originmind-internal-oa-staging:34af7e92-7da5-47cd-b7c0-1270e157c0e6:oa.omindos.ai')
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Reject an unconfirmed or non-main production dispatch
        run: exit 64

  deploy:
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'originmind-internal-oa-staging:34af7e92-7da5-47cd-b7c0-1270e157c0e6:oa.omindos.ai'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production-oa
      url: https://oa.omindos.ai
    concurrency:
      group: oa-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: '41e8b3404be24e1dd288556d77ffc951'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/oa/package-lock.json
      - name: Install locked OA dependencies
        working-directory: apps/oa
        run: npm run install:ci
      - name: Release the fixed OA production target
        working-directory: apps/oa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OA_PRODUCTION_RELEASE_CONFIRM: ${{ inputs.confirmation }}
        run: npm run release:standalone:production
      - name: Preserve the immutable release and recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oa-production-${{ github.sha }}-${{ github.run_attempt }}
          path: apps/oa/.wrangler/releases/production-*
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
