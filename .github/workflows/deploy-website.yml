name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'ops/chat-entry/**'
      - 'apps/website/**'
      - 'media/product-demos/**'
      - 'scripts/prepare-product-demo-media.py'
      - 'tests/website.test.mjs'
      - 'tests/website-pwa.test.mjs'
      - 'scripts/prepare-website-pwa.py'
      - 'tests/website-visits.test.mjs'
      - 'migrations/website/0003_filtered_visit_stats.sql'
      - 'scripts/website-visit-stats.mjs'
      - 'scripts/preserve-website-statistics.mjs'
      - 'tests/preserve-website-statistics.test.mjs'
      - 'tests/website-release-scope.test.mjs'
      - 'tests/cn-research-prototypes.test.mjs'
      - 'scripts/website-release-scope.mjs'
      - 'scripts/prepare-international-artifact.py'
      - 'scripts/prepare-bilingual-navigation.py'
      - 'scripts/prepare-website-review.py'
      - 'tests/international-english-only.test.mjs'
      - 'tests/english-chat-ui.test.mjs'
      - 'tests/english-chat-proxy.test.mjs'
      - 'tests/english-chat-widget.test.mjs'
      - 'tests/test_international_artifact.py'
      - 'scripts/check-website-project.mjs'
      - 'scripts/verify-website-live.mjs'
      - '.github/workflows/deploy-website.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ops/chat-entry/**'
      - 'apps/website/**'
      - 'media/product-demos/**'
      - 'scripts/prepare-product-demo-media.py'
      - 'tests/website.test.mjs'
      - 'tests/website-pwa.test.mjs'
      - 'scripts/prepare-website-pwa.py'
      - 'tests/website-visits.test.mjs'
      - 'migrations/website/0003_filtered_visit_stats.sql'
      - 'scripts/website-visit-stats.mjs'
      - 'scripts/preserve-website-statistics.mjs'
      - 'tests/preserve-website-statistics.test.mjs'
      - 'tests/website-release-scope.test.mjs'
      - 'tests/cn-research-prototypes.test.mjs'
      - 'scripts/website-release-scope.mjs'
      - 'scripts/prepare-international-artifact.py'
      - 'scripts/prepare-bilingual-navigation.py'
      - 'scripts/prepare-website-review.py'
      - 'tests/international-english-only.test.mjs'
      - 'tests/english-chat-ui.test.mjs'
      - 'tests/english-chat-proxy.test.mjs'
      - 'tests/english-chat-widget.test.mjs'
      - 'tests/test_international_artifact.py'
      - 'scripts/check-website-project.mjs'
      - 'scripts/verify-website-live.mjs'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Preview first, then publish production after visual acceptance'
        type: choice
        required: true
        default: preview
        options:
          - preview
          - production
          - verify-production
      statistics_mode:
        description: 'Preserve the pinned live collector for a page-only release, or prepare filtered v2 with D1 permissions'
        type: choice
        required: true
        default: filtered-v2
        options:
          - filtered-v2
          - preserve-current
      release_source:
        description: 'Production source: current main or a pinned, reviewed award-only snapshot'
        type: choice
        required: true
        default: current-main
        options:
          - current-main
          - awards-only-20261018
          - award-2023-20261020

permissions:
  contents: read

# Finish each production deployment before starting another one.
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      WEBSITE_TEST_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'production' && inputs.release_source == 'award-2023-20261020' && '1aad7eca6dde941f9e11011dc61efa0b9137ba68' || github.sha }}
    outputs:
      deploy_international: ${{ steps.scope.outputs.deploy_international }}
      tested_commit: ${{ steps.tested-source.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.WEBSITE_TEST_COMMIT }}
      - name: Validate the fixed 2023 Crystal Award source
        if: github.event_name == 'workflow_dispatch' && inputs.release_source == 'award-2023-20261020'
        env:
          STATISTICS_MODE: ${{ inputs.statistics_mode }}
          RELEASE_TARGET: ${{ inputs.target }}
        run: |
          python3 - <<'PY'
          import hashlib, os, re, subprocess
          from pathlib import Path
          base = '32e7018f04b3c9c04bb75b4375b41b63e54805bb'
          release = '1aad7eca6dde941f9e11011dc61efa0b9137ba68'
          assert os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
          assert os.environ['GITHUB_REF'] == 'refs/heads/main'
          assert os.environ['RELEASE_TARGET'] == 'production'
          assert os.environ['STATISTICS_MODE'] == 'preserve-current'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == release
          parents = subprocess.check_output(['git', 'rev-list', '--parents', '-n', '1', release], text=True).split()
          assert parents == [release, base], parents
          subprocess.run(['git', 'merge-base', '--is-ancestor', release, os.environ['GITHUB_SHA']], check=True)
          page = 'apps/website/en/lab/index.html'
          assets = {
              'apps/website/assets/lab-awards-20261020/sztu-crystal-award-certificate-2023-12.pdf':
                  '6e57e4aec66e37b9acc6a32f801a6e3eaffeaa8acb03c1bb53a2dbb0f4afd621',
              'apps/website/assets/lab-awards-20261020/sztu-crystal-award-certificate-2023-12.webp':
                  '98748ba8da9c8deb18528d205b96b1c3261a4b9a76c23d438ec4aa8e528f852a',
          }
          changed = subprocess.check_output(['git', 'diff', '--name-status', base, release], text=True).splitlines()
          assert set(changed) == {f'M\t{page}', *(f'A\t{path}' for path in assets)}, changed
          old = subprocess.check_output(['git', 'show', f'{base}:{page}'])
          current = Path(page).read_bytes()
          rows = list(re.finditer(rb'(?m)^[ \t]*<li\b(?=[^>]*\bid="sztu-crystal-award-2023")[\s\S]*?</li>[ \t]*\r?\n', current))
          assert len(rows) == 1
          row = rows[0]
          assert current[:row.start()] + current[row.end():] == old, 'Unrelated English lab content changed'
          record = row.group().decode('utf-8')
          assert 'data-date="2023-12"' in record and 'datetime="2023-12"' in record
          assert all(name in record for name in ('Lin Zixin', 'Huang Xinqi', 'Jiao Zihao', 'Zhu Zhikun'))
          assert 'Kuanghai Mingmou' not in record
          for path, expected in assets.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == expected, path
          print('Validated the reviewed award row and two certificate assets; all other source bytes stay at accepted production')
          PY
      - name: Record the source tested by this job
        id: tested-source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Restore approved product demo media
        run: python3 scripts/prepare-product-demo-media.py
      - name: Check website behavior
        run: node --test tests/website.test.mjs tests/website-pwa.test.mjs tests/website-visits.test.mjs tests/website-release-scope.test.mjs tests/cn-research-prototypes.test.mjs tests/international-english-only.test.mjs tests/english-chat-ui.test.mjs tests/english-chat-proxy.test.mjs tests/english-chat-widget.test.mjs tests/preserve-website-statistics.test.mjs ops/chat-entry/gateway.test.mjs ops/chat-entry/course-entry-resources.test.mjs
      - name: Check Chinese search addresses
        run: |
          python3 -m unittest discover -s tests -p test_cn_seo.py
          python3 -m unittest discover -s tests -p test_international_artifact.py
          python3 -m py_compile scripts/prepare-bilingual-navigation.py scripts/prepare-website-review.py
      - name: Determine international release scope
        id: scope
        run: node scripts/website-release-scope.mjs

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.target == 'production' && needs.test.outputs.deploy_international == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: '41e8b3404be24e1dd288556d77ffc951'
      WRANGLER_SEND_METRICS: 'false'
      WEBSITE_RELEASE_COMMIT: ${{ inputs.release_source == 'awards-only-20261018' && '54a8a7f2a9d82a2b5747a5674177d8a7b5a8aba0' || inputs.release_source == 'award-2023-20261020' && '1aad7eca6dde941f9e11011dc61efa0b9137ba68' || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.WEBSITE_RELEASE_COMMIT }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Require the complete test job to cover the selected award source
        if: inputs.release_source == 'award-2023-20261020'
        env:
          TESTED_COMMIT: ${{ needs.test.outputs.tested_commit }}
          STATISTICS_MODE: ${{ inputs.statistics_mode }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          expected = '1aad7eca6dde941f9e11011dc61efa0b9137ba68'
          assert os.environ['STATISTICS_MODE'] == 'preserve-current'
          assert os.environ['TESTED_COMMIT'] == expected
          assert os.environ['WEBSITE_RELEASE_COMMIT'] == expected
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == expected
          PY
      - name: Validate the approved awards-only source
        if: inputs.release_source == 'awards-only-20261018'
        env:
          STATISTICS_MODE: ${{ inputs.statistics_mode }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          base = '437ca28bdc51333b19d76726e782f35c9ac6a545'
          release = '54a8a7f2a9d82a2b5747a5674177d8a7b5a8aba0'
          assert os.environ['STATISTICS_MODE'] == 'preserve-current'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == release
          subprocess.run(['git', 'merge-base', '--is-ancestor', release, os.environ['GITHUB_SHA']], check=True)
          allowed = {'apps/website/cn/lab/index.html', 'apps/website/en/lab/index.html',
                     '.github/workflows/deploy-website.yml', 'docs/lab-evidence-20261017.md',
                     'docs/website-deployment.md'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', base, release], text=True).splitlines())
          assert changed == allowed, changed
          assets = ('award-kangyang-campus-2026.jpg', 'award-inspection-campus-2026.jpg')
          for lang in ('cn', 'en'):
              path = f'apps/website/{lang}/lab/index.html'
              old = subprocess.check_output(['git', 'show', f'{base}:{path}'], text=True)
              rows = old.splitlines(keepends=True)
              removed = [line for line in rows if 'data-date="2026' in line and any(asset in line for asset in assets)]
              assert len(removed) == 2
              expected = ''.join(line for line in rows if line not in removed)
              assert Path(path).read_text() == expected
              assert 'challenge-cup-guangdong-silver-2026.jpg' in expected
              assert 'internet-plus-campus-silver-2022.jpg' in expected
          print('Validated the approved two-award removal; current chat and other website files match the verified production source')
          PY
      - name: Check production project and existing statistics binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_STATISTICS_BASELINE_COMMIT: ${{ inputs.statistics_mode == 'preserve-current' && (inputs.release_source == 'awards-only-20261018' && '437ca28bdc51333b19d76726e782f35c9ac6a545' || '32e7018f04b3c9c04bb75b4375b41b63e54805bb') || '' }}
        run: node scripts/check-website-project.mjs
      - name: Verify the accepted page-only rollback deployment
        if: inputs.statistics_mode == 'preserve-current' && inputs.release_source != 'awards-only-20261018'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const response = await fetch('https://api.cloudflare.com/client/v4/accounts/41e8b3404be24e1dd288556d77ffc951/pages/projects/omindos-website', {
            headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` },
            signal: AbortSignal.timeout(20_000),
          });
          assert.equal(response.status, 200, 'Cloudflare accepted-baseline lookup failed');
          const payload = await response.json();
          assert.equal(payload.success, true, 'Cloudflare accepted-baseline lookup failed');
          const live = payload.result?.canonical_deployment;
          assert.equal(live?.id, 'ac4d6f64-3b0f-4e34-9bbd-57b825d223c8', 'Production deployment changed; review its collector and rollback point');
          assert.equal(live?.deployment_trigger?.metadata?.commit_hash, '32e7018f04b3c9c04bb75b4375b41b63e54805bb', 'Production commit changed; review its collector');
          console.log('Verified the accepted page-only rollback deployment and commit');
          JS
      - name: Preserve legacy baseline and prepare isolated filtered statistics
        if: inputs.statistics_mode != 'preserve-current'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/website-visit-stats.mjs --prepare
      - name: Restore approved product demo media
        run: python3 scripts/prepare-product-demo-media.py
      - name: Test the selected awards-only production source
        if: inputs.release_source == 'awards-only-20261018' || inputs.release_source == 'award-2023-20261020'
        run: |
          node --test tests/website.test.mjs tests/website-pwa.test.mjs tests/website-visits.test.mjs tests/website-release-scope.test.mjs tests/cn-research-prototypes.test.mjs tests/international-english-only.test.mjs tests/english-chat-ui.test.mjs tests/preserve-website-statistics.test.mjs ops/chat-entry/gateway.test.mjs
          python3 -m unittest discover -s tests -p test_cn_seo.py
          python3 -m unittest discover -s tests -p test_international_artifact.py
      - name: Prepare English site and domestic redirects
        run: python3 scripts/prepare-international-artifact.py apps/website /tmp/omindos-international
      - name: Retain the existing production statistics for this page-only release
        if: inputs.statistics_mode == 'preserve-current'
        run: |
          node scripts/preserve-website-statistics.mjs /tmp/omindos-international
          WEBSITE_ARTIFACT=/tmp/omindos-international node --test tests/preserve-website-statistics.test.mjs
      - name: Publish existing Cloudflare Pages project
        id: publish
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.129.0'
          command: >-
            pages deploy /tmp/omindos-international
            --project-name omindos-website
            --branch main
            --commit-hash ${{ env.WEBSITE_RELEASE_COMMIT }}
            --commit-message "GitHub Actions website deployment"
            --commit-dirty=false
      - name: Verify production deployment matches this commit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_COMMIT_SHA: ${{ env.WEBSITE_RELEASE_COMMIT }}
          EXPECTED_DEPLOYMENT_ID: ${{ steps.publish.outputs.pages-deployment-id }}
        run: node scripts/check-website-project.mjs --deployed
      - name: Check the public website after deployment
        run: node scripts/verify-website-live.mjs
      - name: Report filtered statistics without recording a synthetic page view
        if: inputs.statistics_mode != 'preserve-current'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/website-visit-stats.mjs --report

  verify-production:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.target == 'verify-production'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: '41e8b3404be24e1dd288556d77ffc951'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check the production project and preserved database binding without deploying
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/check-website-project.mjs
      - name: Verify the public website without recording page views
        run: node scripts/verify-website-live.mjs

  preview:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.target == 'preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: '41e8b3404be24e1dd288556d77ffc951'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Record current production and verify the existing project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/check-website-preview.mjs --before
      - name: Restore approved product demo media
        run: python3 scripts/prepare-product-demo-media.py
      - name: Prepare English preview
        run: |
          python3 scripts/prepare-international-artifact.py apps/website /tmp/omindos-english-preview
          python3 scripts/prepare-website-review.py /tmp/omindos-english-preview
      - name: Publish public preview on an isolated branch
        id: publish
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.129.0'
          command: >-
            pages deploy /tmp/omindos-english-preview
            --project-name omindos-website
            --branch english-review
            --commit-hash ${{ github.sha }}
            --commit-message "English website visual review"
            --commit-dirty=false
      - name: Verify preview commit and unchanged production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_DEPLOYMENT_ID: ${{ steps.publish.outputs.pages-deployment-id }}
        run: node scripts/check-website-preview.mjs --after




