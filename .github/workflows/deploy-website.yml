name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'ops/chat-entry/**'
      - 'apps/website/**'
      - 'media/product-demos/**'
      - 'scripts/prepare-product-demo-media.py'
      - 'tests/website.test.mjs'
      - 'tests/website-visits.test.mjs'
      - 'migrations/website/0003_filtered_visit_stats.sql'
      - 'scripts/website-visit-stats.mjs'
      - 'tests/website-release-scope.test.mjs'
      - 'tests/cn-research-prototypes.test.mjs'
      - 'scripts/website-release-scope.mjs'
      - 'scripts/prepare-international-artifact.py'
      - 'tests/international-english-only.test.mjs'
      - 'tests/test_international_artifact.py'
      - 'scripts/check-website-project.mjs'
      - 'scripts/verify-website-live.mjs'
      - '.github/workflows/deploy-website.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ops/chat-entry/**'
      - 'apps/website/**'
      - 'media/product-demos/**'
      - 'scripts/prepare-product-demo-media.py'
      - 'tests/website.test.mjs'
      - 'tests/website-visits.test.mjs'
      - 'migrations/website/0003_filtered_visit_stats.sql'
      - 'scripts/website-visit-stats.mjs'
      - 'tests/website-release-scope.test.mjs'
      - 'tests/cn-research-prototypes.test.mjs'
      - 'scripts/website-release-scope.mjs'
      - 'scripts/prepare-international-artifact.py'
      - 'tests/international-english-only.test.mjs'
      - 'tests/test_international_artifact.py'
      - 'scripts/check-website-project.mjs'
      - 'scripts/verify-website-live.mjs'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Preview first, then publish production after visual acceptance'
        type: choice
        required: true
        default: preview
        options:
          - preview
          - production

permissions:
  contents: read

# Finish each production deployment before starting another one.
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      deploy_international: ${{ steps.scope.outputs.deploy_international }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Restore approved product demo media
        run: python3 scripts/prepare-product-demo-media.py
      - name: Check website behavior
        run: node --test tests/website.test.mjs tests/website-visits.test.mjs tests/website-release-scope.test.mjs tests/cn-research-prototypes.test.mjs tests/international-english-only.test.mjs ops/chat-entry/gateway.test.mjs
      - name: Check Chinese search addresses
        run: |
          python3 -m unittest discover -s tests -p test_cn_seo.py
          python3 -m unittest discover -s tests -p test_international_artifact.py
      - name: Determine international release scope
        id: scope
        run: node scripts/website-release-scope.mjs

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.target == 'production' && needs.test.outputs.deploy_international == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: '41e8b3404be24e1dd288556d77ffc951'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check production project and existing statistics binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/check-website-project.mjs
      - name: Preserve legacy baseline and prepare isolated filtered statistics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/website-visit-stats.mjs --prepare
      - name: Restore approved product demo media
        run: python3 scripts/prepare-product-demo-media.py
      - name: Prepare English site and domestic redirects
        run: python3 scripts/prepare-international-artifact.py apps/website /tmp/omindos-international
      - name: Publish existing Cloudflare Pages project
        id: publish
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.129.0'
          command: >-
            pages deploy /tmp/omindos-international
            --project-name omindos-website
            --branch main
            --commit-hash ${{ github.sha }}
            --commit-message "GitHub Actions website deployment"
            --commit-dirty=false
      - name: Verify production deployment matches this commit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          EXPECTED_DEPLOYMENT_ID: ${{ steps.publish.outputs.pages-deployment-id }}
        run: node scripts/check-website-project.mjs --deployed
      - name: Check the public website after deployment
        run: node scripts/verify-website-live.mjs
      - name: Report filtered statistics without recording a synthetic page view
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/website-visit-stats.mjs --report

  preview:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.target == 'preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: '41e8b3404be24e1dd288556d77ffc951'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Record current production and verify the existing project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/check-website-preview.mjs --before
      - name: Restore approved product demo media
        run: python3 scripts/prepare-product-demo-media.py
      - name: Prepare English preview
        run: python3 scripts/prepare-international-artifact.py apps/website /tmp/omindos-english-preview
      - name: Publish public preview on an isolated branch
        id: publish
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.129.0'
          command: >-
            pages deploy /tmp/omindos-english-preview
            --project-name omindos-website
            --branch english-review
            --commit-hash ${{ github.sha }}
            --commit-message "English website visual review"
            --commit-dirty=false
      - name: Verify preview commit and unchanged production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_DEPLOYMENT_ID: ${{ steps.publish.outputs.pages-deployment-id }}
        run: node scripts/check-website-preview.mjs --after


